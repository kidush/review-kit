# .github/workflows/pr.yml in a project repo
name: PR

on:
  pull_request:

jobs:
  review-gate:
    uses: kidush/review-kit/.github/workflows/pr-check.yml@main  # pin a tag in practice
    with:
      skip-tests: true          # tests already run in the project's own test job
